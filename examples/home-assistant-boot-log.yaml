# Paste into the YAML editor of a new Home Assistant automation.
# Replace samsung-s3 with the topic prefix configured on your controller.
alias: Samsung controller readiness log
mode: queued
max: 10
triggers:
  - trigger: mqtt
    topic: samsung-s3/diagnostics/boot
conditions:
  - condition: template
    value_template: >-
      {{ trigger.payload_json is defined
         and trigger.payload_json.event | default('') in
           ['boot_ready', 'mqtt_reconnected', 'ac_connection_restored']
         and trigger.payload_json.controller_ready | default(false) }}
actions:
  - action: system_log.write
    data:
      level: info
      logger: samsung_controller
      message: >-
        {% set p = trigger.payload_json %}
        {% if p.event == 'boot_ready' %}Samsung controller boot completed successfully.
        {% elif p.event == 'mqtt_reconnected' %}Samsung controller MQTT connection restored.
        {% else %}Samsung controller AC communication restored.{% endif %}
        Firmware={{ p.version }}, boot_id={{ p.boot_id }}, uptime={{ p.uptime_s }} s.
        {% if p.ac_ready %}AC communication ready.
        {% else %}Controller ready; awaiting AC communication.{% endif %}
