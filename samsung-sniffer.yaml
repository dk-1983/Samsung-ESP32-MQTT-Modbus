# Diagnostic build only. Two receive-only UARTs. No climate/MQTT/Modbus or UART writes.
esphome:
  name: samsung-s3
  friendly_name: Samsung passive UART capture
  build_path: ../work/build-sniffer
  project:
    name: fourvrs.samsung_uart_sniffer
    version: 0.4.7-sniffer
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: arduino
psram:
  mode: octal
  speed: 80MHz
logger:
  baud_rate: 0
wifi:
  reboot_timeout: 0s
  ap:
    ssid: Samsung-Setup
    password: !secret setup_password
    ap_timeout: 10s
captive_portal:
web_server:
  port: 8080
  local: true
  auth:
    username: admin
    password: !secret web_password
ota:
  - platform: esphome
    password: !secret ota_password
external_components:
  - source:
      type: local
      path: components
    components: [uart_sniffer]
uart:
  - id: sniff_a
    rx_pin:
      number: GPIO18
      mode:
        input: true
        pullup: false
        pulldown: false
    baud_rate: 9600
    rx_buffer_size: 4096
    rx_full_threshold: 1
    rx_timeout: 2
  - id: sniff_b
    rx_pin:
      number: GPIO17
      mode:
        input: true
        pullup: false
        pulldown: false
    baud_rate: 9600
    rx_buffer_size: 4096
    rx_full_threshold: 1
    rx_timeout: 2
uart_sniffer:
  rx_a: sniff_a
  rx_b: sniff_b
  password: !secret web_password
