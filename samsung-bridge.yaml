# Experimental inline bridge. Requires four isolated UART wires; see docs/UART_BRIDGE_RU.md.
esphome:
  name: samsung-s3
  friendly_name: Samsung inline UART bridge
  build_path: ../work/build-bridge
  project:
    name: fourvrs.samsung_uart_bridge
    version: 0.4.9-bridge-fan
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: arduino
psram:
  mode: octal
  speed: 80MHz
logger:
  baud_rate: 0
wifi:
  reboot_timeout: 0s
  ap:
    ssid: Samsung-Setup
    password: !secret setup_password
    ap_timeout: 10s
captive_portal:
web_server:
  port: 8080
  local: true
  auth:
    username: admin
    password: !secret web_password
ota:
  - platform: esphome
    password: !secret ota_password
external_components:
  - source:
      type: local
      path: components
    components: [uart_sniffer]
uart:
  - id: sniff_a
    tx_pin: GPIO17
    rx_pin:
      number: GPIO18
      mode:
        input: true
        pullup: false
        pulldown: false
    baud_rate: 9600
    rx_buffer_size: 4096
    rx_full_threshold: 1
    rx_timeout: 2
  - id: sniff_b
    tx_pin: GPIO16
    rx_pin:
      number: GPIO15
      mode:
        input: true
        pullup: false
        pulldown: false
    baud_rate: 9600
    rx_buffer_size: 4096
    rx_full_threshold: 1
    rx_timeout: 2
uart_sniffer:
  id: inline_bridge
  bridge: true
  factory_rx_gpio: 15
  factory_tx_gpio: 16
  rx_a: sniff_a
  rx_b: sniff_b
  password: !secret web_password

switch:
  - platform: template
    name: "UART bridge forwarding"
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: id(inline_bridge).set_forwarding(true);
    turn_off_action:
      - lambda: id(inline_bridge).set_forwarding(false);
